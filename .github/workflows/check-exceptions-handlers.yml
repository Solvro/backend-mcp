name: Check Exception Handlers

on:
  push:
    paths:
      - 'libs/common/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'libs/common/**'

jobs:
  exceptions-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi requests

      - name: Run exception handlers check script
        run: |
          python libs/common/scripts/check_exceptions_handlers.py
