name: E2E

on:
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.12"

jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Bring up stack + httpbin
        run: docker compose -f docker/compose.e2e.yml up -d --build --wait

      - name: Run e2e tests
        run: just test-e2e

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker/compose.e2e.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.e2e.yml down -v
