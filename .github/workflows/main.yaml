name: Main-CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  UV_VERSION: "0.5.10"
  PYTHON_VERSION: "3.12"
  JUST_VERSION: "1.43.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install dependencies
        run: uv sync && uv sync --dev

      - name: Ruff
        run: uv run ruff check .

  test:
    name: Unit/Integration tests
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: uv sync && uv sync --dev --all-packages

      - name: Run unit/integration tests
        run: just test

  build-check:
    name: Services build check
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build service images
        run: just build

  migrations:
    name: DB migrations
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcp_backend
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d mcp_backend"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/mcp_backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: uv sync --dev --all-packages

      - name: Run migrations (alembic upgrade head)
        run: just migrate

      - name: Verify DB healthcheck query
        run: |
          uv run --package auth-service python - <<'PY'
          import asyncio
          from common.db import check_database, dispose_engine

          async def main() -> None:
              assert await check_database()
              await dispose_engine()

          asyncio.run(main())
          PY
