name: Main-CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  UV_VERSION: "0.5.10"
  PYTHON_VERSION: "3.12"
  JUST_VERSION: "1.43.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install dependencies
        run: uv sync && uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Shellcheck deploy scripts
        run: |
          # shellcheck disable=SC2046 # one argument per script; no paths contain spaces
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            $(find deploy -type f \( -name '*.sh' -o -name 'mcpwr-deploy' \) | sort)

  test:
    name: Unit/Integration tests
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: uv sync && uv sync --dev --all-packages

      - name: Run unit/integration tests
        run: just test

  build-check:
    name: Services build check
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build service images
        run: just build

  migrations:
    name: DB migrations
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcp_backend
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d mcp_backend"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/mcp_backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: uv sync --dev --all-packages

      - name: Run migrations (alembic upgrade head)
        run: just migrate

      - name: Verify DB healthcheck query
        run: |
          uv run --package auth-service python - <<'PY'
          import asyncio
          from common.db import check_database, dispose_engine

          async def main() -> None:
              assert await check_database()
              await dispose_engine()

          asyncio.run(main())
          PY

  publish:
    name: Publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, build-check, migrations]
    permissions:
      contents: read
      packages: write
    # Queue publishes instead of running them side by side: an older run finishing last would
    # move `main` back to an older commit.
    concurrency:
      group: publish-main
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io/solvro

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/auth-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/backend-mcp-auth:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend-mcp-auth
          cache-to: type=gha,mode=max,scope=backend-mcp-auth

      - name: Build and push chat-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/chat-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/backend-mcp-chat:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend-mcp-chat
          cache-to: type=gha,mode=max,scope=backend-mcp-chat

      - name: Check the images carry no keys or env files
        run: |
          for image in backend-mcp-auth backend-mcp-chat; do
            ref="$REGISTRY/$image:sha-$GITHUB_SHA"
            docker pull -q "$ref" >/dev/null
            found=$(docker run --rm --entrypoint sh "$ref" -c \
              'find /app -path /app/.venv -prune -o \( -name "*.pem" -o -name "*.key" -o -name ".env" -o -name ".env.*" \) -print')
            if [ -n "$found" ]; then
              echo "::error::$image contains key or env files:"
              echo "$found"
              exit 1
            fi
          done

      # Last, so the deploy agent never sees a `main` whose sibling image is missing.
      - name: Move the main tags
        run: |
          # A newer commit may already be on main (its run queued behind this one, or this one
          # re-run later): never move the tag back to an older commit.
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          # An unreadable head must fail the job, not pass it with the tag silently left behind.
          if [ -z "$head" ]; then echo "::error::could not read the head of main; the main tag was not moved"; exit 1; fi
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main is now $head; not moving the tag to $GITHUB_SHA"; exit 0; fi
          for image in backend-mcp-auth backend-mcp-chat; do
            docker buildx imagetools create -t "$REGISTRY/$image:main" "$REGISTRY/$image:sha-$GITHUB_SHA"
          done
