name: ml-mcp-backend-e2e

services:
  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "18000:8000"
    depends_on:
      httpbin:
        condition: service_started

  chat-service:
    build:
      context: ..
      dockerfile: services/chat-service/Dockerfile
    environment:
      # [TODO] placeholder upstream so future MCP-gateway tests can point at httpbin delay and status
      MCP_SERVER_URL: "http://httpbin:8080/mcp"
    ports:
      - "18001:8000"
    depends_on:
      httpbin:
        condition: service_started

  httpbin:
    image: mccutchen/go-httpbin:v2.15.0
    ports:
      - "18080:8080"
  mailpit:
    image: mailpit/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "18025:8025" # web UI
