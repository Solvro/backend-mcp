# The e2e stack (TST-3). `just test-e2e` brings it up, runs `pytest -m "e2e and not live"`
# against it and tears it down again; CI runs the same recipe.
#
# Tests reach the services through the dev TLS edge (nginx on :18443), like a browser would.
# The exceptions are chat-slow and chat-broken: chat-service instances whose MCP server is
# httpbin misbehaving on purpose (/delay, /status/503), so the gateway's timeout and circuit
# breaker paths run without a live ml-mcp or any LLM key. They are reached on their own ports.
# docker/mcp-stub stands in for ml-mcp on the happy path.
#
# Its own subnet (10.91.0.0/24), so it can run next to the dev stack (10.89.0.0/24).
name: ml-mcp-backend-e2e

x-healthcheck-http: &healthcheck-http
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

# chat-service builds the image; chat-slow and chat-broken only run it (building one tag from
# three services in parallel races).
x-chat-service: &chat-service
  image: ml-mcp-backend-e2e/chat-service
  pull_policy: never
  volumes:
    - ./.e2e-keys:/run/e2e-keys:ro
  healthcheck: *healthcheck-http
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [e2e]

x-chat-env: &chat-env
  JWT_ALGORITHM: RS256
  JWT_PUBLIC_KEY_FILE: /run/e2e-keys/jwt_public.pem
  MONGO_URI: mongodb://mongo:27017
  REDIS_URL: redis://redis:6379
  FORWARDED_ALLOW_IPS: 10.91.0.10
  # Every test calls from the same address: the real per-IP daily quotas would fail the suite.
  CHAT_DAILY_QUOTA_ANONYMOUS: "1000"
  CHAT_DAILY_QUOTA_AUTHENTICATED: "1000"
  # Deterministic answers: never serve one test's answer to another from the semantic cache.
  ANSWER_CACHE_ENABLED: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcp_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcp_backend"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [e2e]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025" # SMTP (libs/common's e2e mail test sends here)
      - "8025:8025" # API: the tests read verification emails from it
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  httpbin:
    image: mccutchen/go-httpbin:v2.15.0
    networks: [e2e]

  mcp-stub:
    build:
      context: ./mcp-stub
    image: ml-mcp-backend-e2e/mcp-stub
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  migrate:
    image: ml-mcp-backend-e2e/auth-service  # built by auth-service
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/mcp_backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [e2e]

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    image: ml-mcp-backend-e2e/auth-service
    environment:
      JWT_ALGORITHM: RS256
      JWT_PRIVATE_KEY_FILE: /run/e2e-keys/jwt_private.pem
      JWT_PUBLIC_KEY_FILE: /run/e2e-keys/jwt_public.pem
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/mcp_backend
      REDIS_URL: redis://redis:6379
      FORWARDED_ALLOW_IPS: 10.91.0.10
      FRONTEND_URL: https://localhost:18443
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"  # mailpit speaks plain SMTP; the default (true) fails every send
    volumes:
      - ./.e2e-keys:/run/e2e-keys:ro
    healthcheck: *healthcheck-http
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [e2e]

  chat-service:
    <<: *chat-service
    build:
      context: ..
      dockerfile: services/chat-service/Dockerfile
    environment:
      <<: *chat-env
      MCP_SERVER_URL: http://mcp-stub:8005/mcp
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-stub:
        condition: service_healthy

  # MCP-1: every MCP call outlives its 2 s budget (httpbin holds it for 5 s).
  chat-slow:
    <<: *chat-service
    environment:
      <<: *chat-env
      MCP_SERVER_URL: http://httpbin:8080/delay/5
      MCP_TIMEOUT_SECONDS: "2"
      MCP_INIT_TIMEOUT_SECONDS: "2"
      MCP_MAX_RETRIES: "0"
    ports:
      - "18011:8000"

  # MCP-2: every MCP call is an outage (503); the breaker opens after 2 and stays open 60 s.
  chat-broken:
    <<: *chat-service
    environment:
      <<: *chat-env
      MCP_SERVER_URL: http://httpbin:8080/status/503
      MCP_MAX_RETRIES: "0"
      MCP_BREAKER_FAILURE_THRESHOLD: "2"
      MCP_BREAKER_RESET_TIMEOUT_SECONDS: "60"
    ports:
      - "18012:8000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/nginx/templates:/etc/nginx/templates:ro
    environment:
      SERVER_NAME: localhost
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      PUBLIC_HTTPS_SUFFIX: ":18443"
      NGINX_ENVSUBST_FILTER: ^(SERVER_NAME|CORS_ALLOWED_ORIGIN|PUBLIC_HTTPS_SUFFIX)$$
    secrets:
      - tls_cert
      - tls_key
    ports:
      - "18443:443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks:
      e2e:
        ipv4_address: 10.91.0.10

secrets:
  tls_cert:
    file: ./.tls/cert.pem
  tls_key:
    file: ./.tls/key.pem

networks:
  e2e:
    driver: bridge
    ipam:
      config:
        # Dynamic addresses from the upper half only, so nothing can take nginx's fixed .10.
        - subnet: 10.91.0.0/24
          ip_range: 10.91.0.128/25
