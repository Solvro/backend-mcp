name: ml-mcp-backend-e2e

services:
  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    environment:
      JWT_ALGORITHM: RS256
      JWT_PRIVATE_KEY_FILE: /run/e2e-keys/jwt_private.pem
      JWT_PUBLIC_KEY_FILE: /run/e2e-keys/jwt_public.pem
    volumes:
      - ./.e2e-keys:/run/e2e-keys:ro
    ports:
      - "18000:8000"
    depends_on:
      httpbin:
        condition: service_started

  chat-service:
    build:
      context: ..
      dockerfile: services/chat-service/Dockerfile
    environment:
      # [TODO] placeholder upstream so future MCP-gateway tests can point at httpbin delay and status
      MCP_SERVER_URL: "http://httpbin:8080/mcp"
    ports:
      - "18001:8000"
    depends_on:
      httpbin:
        condition: service_started

  httpbin:
    image: mccutchen/go-httpbin:v2.15.0
    ports:
      - "18080:8080"
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
