name: ml-mcp-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_backend}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mcp_backend}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [backend]

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [backend]

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]  # local mail sink only; `just up` enables it, the prod overlay never does
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [backend]

  migrate:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    image: ml-mcp-backend/auth-service:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mcp_backend}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    image: ml-mcp-backend/auth-service:dev
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-10.89.0.10}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mcp_backend}
      REDIS_URL: redis://redis:6379
      # Dev RS256 pair from `just e2e-keys` (gitignored); prod mounts real docker secrets.
      JWT_PRIVATE_KEY_FILE: /run/dev-keys/jwt_private.pem
      JWT_PUBLIC_KEY_FILE: /run/dev-keys/jwt_public.pem
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - ./.e2e-keys:/run/dev-keys:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

  chat-service:
    build:
      context: ..
      dockerfile: services/chat-service/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-10.89.0.10}
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:8005/mcp}
      JWT_PUBLIC_KEY_FILE: /run/dev-keys/jwt_public.pem
    volumes:
      - ./.e2e-keys:/run/dev-keys:ro
    ports:
      - "8001:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend, solvro_internal]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/nginx/templates:/etc/nginx/templates:ro
    environment:
      # Rendered into the server blocks at start; see gateway/nginx/templates.
      SERVER_NAME: ${SERVER_NAME:-localhost}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      PUBLIC_HTTPS_SUFFIX: ${PUBLIC_HTTPS_SUFFIX:-:8443}
      NGINX_ENVSUBST_FILTER: ^(SERVER_NAME|CORS_ALLOWED_ORIGIN|PUBLIC_HTTPS_SUFFIX)$$
    secrets:
      - tls_cert
      - tls_key
    ports:
      - "8080:80"
      - "8443:443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 10.89.0.10

  k6:
    image: grafana/k6:latest
    profiles: [load]
    command: ["run", "/scripts/load_test.js"]
    environment:
      BASE_URL: http://nginx
    volumes:
      - ../tests/load/load_test.js:/scripts/load_test.js:ro
    depends_on:
      nginx:
        condition: service_started
    networks: [backend]

secrets:
  tls_cert:
    file: ./.tls/cert.pem
  tls_key:
    file: ./.tls/key.pem


volumes:
  pgdata:
  mongodata:
  redisdata:

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.0.0/24
  solvro_internal:
    external: true
    name: solvro-mcp-internal
