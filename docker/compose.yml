name: ml-mcp-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_backend}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mcp_backend}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [backend]

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [backend]

  migrate:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    image: ml-mcp-backend/auth-service:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mcp_backend}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    image: ml-mcp-backend/auth-service:dev
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mcp_backend}
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

  chat-service:
    build:
      context: ..
      dockerfile: services/chat-service/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://host.docker.internal:8005/mcp}

    ports:
      - "8001:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks: [backend]

volumes:
  pgdata:
  mongodata:
  redisdata:

networks:
  backend:
    driver: bridge
