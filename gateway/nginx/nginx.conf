worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # peer = the direct TCP peer (Coolify's proxy in production), xff = what it forwarded;
    # `mcpwr-deploy backend proxies` reads these to find the address to trust.
    log_format edge '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rid=$request_id_final rt=$request_time urt=$upstream_response_time '
                    'peer=$realip_remote_addr xff="$http_x_forwarded_for"';
    access_log /dev/stdout edge;
    error_log  /dev/stderr warn;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout      65s;
    client_header_timeout  15s;
    client_body_timeout    15s;
    # Mirrors MAX_REQUEST_BODY_SIZE (1 MiB) so oversized bodies never reach a worker.
    client_max_body_size   1m;

    upstream auth_service {
        server auth-service:8000;
        keepalive 16;
    }
    upstream chat_service {
        server chat-service:8000;
        keepalive 16;
    }

    # Propagate a caller-supplied X-Request-ID, else mint one.
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    map $http_origin $cors_origin {
        default "";
        include /etc/nginx/conf.d/cors_origins.map;
    }
    # Preflight-only headers: emitted when the origin is allowed AND the method is OPTIONS.
    map "$cors_origin:$request_method" $cors_preflight_methods {
        default "";
        "~^.+:OPTIONS$" "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    }
    map "$cors_origin:$request_method" $cors_preflight_headers {
        default "";
        "~^.+:OPTIONS$" "Authorization, Content-Type, X-Request-ID";
    }
    map "$cors_origin:$request_method" $cors_preflight_max_age {
        default "";
        "~^.+:OPTIONS$" "600";
    }
    map $cors_origin $cors_credentials {
        default "";
        "~.+"   "true";
    }
    map $cors_origin $cors_expose {
        default "";
        "~.+"   "X-Request-ID, X-Trace-ID, X-Process-Time, X-Session-ID, X-User-ID";
    }

    include /etc/nginx/conf.d/*.conf;
}
