[project]
name = "ml-mcp-backend"
version = "0.1.0"
description = "Backend for internal MCP Solvro server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.uv.workspace]
members = ["services/*", "libs/*"]

[tool.pytest.ini_options]
markers = [
    "unit: marks unit tests",
]
