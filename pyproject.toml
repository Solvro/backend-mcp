[project]
name = "ml-mcp-backend"
version = "0.1.0"
description = "Backend for internal MCP Solvro server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "T"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest-cov>=5.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "httpx2>=2.9.1",
    "httpx>=0.28.1",
]

[tool.uv.workspace]
members = ["services/*", "libs/*"]

[tool.pytest.ini_options]
markers = [
    "unit: marks unit tests",
    "e2e: marks end-to-end tests",
]

[tool.coverage.run]
branch = true
source = ["common"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
