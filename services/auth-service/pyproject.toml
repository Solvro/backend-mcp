[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "auth-service"
version = "0.1.0"
description = "Authentication service for ml-mcp-backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "common",
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["auth_app"]

[tool.uv.sources]
common = { workspace = true }
